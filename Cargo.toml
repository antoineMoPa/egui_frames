[package]
name = "egui_frames"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Tabs, splits and draggable panes for egui"
authors = ["Antoine M-P"]
license = "MIT"
repository = "https://github.com/antoineMoPa/egui_frames"
documentation = "https://docs.rs/egui_frames"
readme = "README.md"
keywords = ["egui", "gui", "tabs", "panes", "docking"]
categories = ["gui"]
exclude = [".github/"]

[package.metadata.docs.rs]
all-features = true

# Published on its own: the crate is a widget, not part of whatever binary vendors it.
[workspace]

[features]
default = []
## Store and restore an arrangement: `Layout<P>` gains `Serialize` and `Deserialize`.
serde = ["dep:serde"]

[dependencies]
egui = "0.36"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_kittest = "0.36"
serde_json = "1"

[lints.rust]
missing_docs = "warn"
